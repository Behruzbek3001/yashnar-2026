services:
  - type: web
    name: yashnar
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: SQL_HOST
        fromDatabase: { name: yashnar-db, property: host }
      - key: SQL_PORT
        fromDatabase: { name: yashnar-db, property: port }
      - key: SQL_USER
        fromDatabase: { name: yashnar-db, property: user }
      - key: SQL_PASSWORD
        fromDatabase: { name: yashnar-db, property: password }
      - key: SQL_DB_NAME
        fromDatabase: { name: yashnar-db, property: database }

databases:
  - name: yashnar-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
